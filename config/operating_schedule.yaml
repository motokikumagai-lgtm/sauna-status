# 営業カレンダー設定
# ------------------------------------------------------------
# 各時間枠（部）の意味:
#   1: 10:00〜
#   2: 13:00〜
#   3: 16:00〜
#   4: 19:00〜
#
# 設定ルール:
#   - weekly_default: 曜日ごとのデフォルト営業枠
#     0=月, 1=火, 2=水, 3=木, 4=金, 5=土, 6=日
#     空配列 [] = 休業
#   - overrides: 日付指定の上書き（YYYY-MM-DD）
#     "closed" を指定すると休業
#     リスト [1,2,3] を指定するとその枠のみ営業
# ------------------------------------------------------------

weekly_default:
  0: [1, 2, 3]      # 月（10/13/16時）
  1: []             # 火（休業）
  2: [1, 2, 3]      # 水（10/13/16時）
  3: [1, 2, 3]      # 木（10/13/16時）
  4: [1, 2, 3, 4]   # 金（10/13/16/19時、全部営業）
  5: [1, 2, 3]      # 土（10/13/16時）
  6: [1, 2, 3]      # 日（10/13/16時）

# 日付指定の上書き（臨時休業・特別営業のみ）
# 例:
#   "2026-08-13": "closed"    # 臨時休業
#   "2026-12-31": [1, 2]      # 大晦日は午前のみ
overrides:
  # 金曜の2〜4部シフトは6月から。5月中の残り金曜は1〜3部。
  "2026-05-29": [1, 2, 3]
  # 火曜は通常休業だが、5/26 と 6/2 は例外的に営業（1〜3部）
  "2026-05-26": [1, 2, 3]
  "2026-06-02": [1, 2, 3]
  # 6月・7月の金曜 override は weekly_default[金]=[1,2,3,4] に変更したので削除（冗長）
  # 火曜例外営業
  "2026-07-14": [2, 3]         # 2部・3部のみ (13時/16時)
  "2026-07-28": [2, 3]         # 2部・3部のみ (13時/16時)
  "2026-08-04": [2, 3]         # 2部・3部のみ (13時/16時)
  "2026-08-11": [1, 2, 3]
  "2026-08-18": [1, 2, 3]
  "2026-08-25": [1, 2, 3]
  "2026-09-01": [1, 2, 3]
  "2026-09-15": [1, 2, 3]
  "2026-09-22": [1, 2, 3]      # 秋分の日
  "2026-10-06": [1, 2, 3]
  "2026-10-20": [1, 2, 3]
  # 10月の金曜は 1〜3部営業（weekly_default の [1,2,3,4] から 4部を除外）
  "2026-10-02": [1, 2, 3]
  "2026-10-09": [1, 2, 3]
  "2026-10-16": [1, 2, 3]
  "2026-10-23": [1, 2, 3]
  "2026-10-30": [1, 2, 3]
